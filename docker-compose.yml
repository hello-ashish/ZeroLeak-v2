services:
  mongodb:
    image: mongo:7
    container_name: zeroleak-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-zeroleak}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-zeroleak_secret}
      MONGO_INITDB_DATABASE: zeroleak
    volumes:
      - mongodb_data:/data/db
    networks:
      - zeroleak-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: zeroleak-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-zeroleak_redis} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - zeroleak-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-zeroleak_redis}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: zeroleak-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_USERNAME:-zeroleak}:${MONGO_PASSWORD:-zeroleak_secret}@mongodb:27017/zeroleak?authSource=admin}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-zeroleak_redis}@redis:6379}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - zeroleak-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: zeroleak-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - zeroleak-network

  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: zeroleak-backend-prod
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "4000:4000"
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_USERNAME:-zeroleak}:${MONGO_PASSWORD:-zeroleak_secret}@mongodb:27017/zeroleak?authSource=admin}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-zeroleak_redis}@redis:6379}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      zeroleak-network:
        aliases:
          - backend

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: zeroleak-frontend-prod
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "80:80"
    depends_on:
      backend-prod:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - zeroleak-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  zeroleak-network:
    driver: bridge
