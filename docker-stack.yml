services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-zeroleak}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-zeroleak_secret}
      MONGO_INITDB_DATABASE: zeroleak
    volumes:
      - mongodb_data:/data/db
    networks:
      - zeroleak-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-zeroleak_redis} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - zeroleak-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-zeroleak_redis}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    image: zeroleak-v2-backend:latest
    ports:
      - "4000:4000"
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=${MONGODB_URI:-mongodb://${MONGO_USERNAME:-zeroleak}:${MONGO_PASSWORD:-zeroleak_secret}@mongodb:27017/zeroleak?authSource=admin}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-zeroleak_redis}@redis:6379}
    networks:
      - zeroleak-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  frontend:
    image: zeroleak-v2-frontend:latest
    ports:
      - "80:80"
    networks:
      - zeroleak-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

volumes:
  mongodb_data:
  redis_data:

networks:
  zeroleak-network:
    driver: overlay
