version: '3.8'

services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-zeroleak}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-zeroleak_secret}
      MONGO_INITDB_DATABASE: zeroleak
    volumes:
      - mongodb_data:/data/db
    networks:
      - zeroleak-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - zeroleak-network
    deploy:
      replicas: 1

  backend:
    image: zeroleak-v2-backend:latest
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-zeroleak}:${MONGO_PASSWORD:-zeroleak_secret}@mongodb:27017/zeroleak?authSource=admin
      - REDIS_URL=redis://redis:6379
    networks:
      - zeroleak-network
    deploy:
      replicas: 2 # You can scale this up easily in swarm
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  frontend:
    image: zeroleak-v2-frontend:latest
    ports:
      - "80:80"
    networks:
      - zeroleak-network
    deploy:
      replicas: 2 # You can scale this up easily in swarm
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

volumes:
  mongodb_data:
  redis_data:

networks:
  zeroleak-network:
    driver: overlay
