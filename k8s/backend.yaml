apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: zeroleak
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  selector:
    app.kubernetes.io/name: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: zeroleak
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: zeroleak-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: zeroleak-config
            - secretRef:
                name: zeroleak-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: fabric-crypto-certs
              mountPath: /app/fabric-crypto/certs
              readOnly: true
            - name: fabric-crypto-keys
              mountPath: /app/fabric-crypto/keys
              readOnly: true
            - name: fabric-crypto-tls
              mountPath: /app/fabric-crypto/tls
              readOnly: true
      volumes:
        - name: fabric-crypto-certs
          secret:
            secretName: fabric-crypto
            items:
              - key: cert.pem
                path: cert.pem
        - name: fabric-crypto-keys
          secret:
            secretName: fabric-crypto
            items:
              - key: key.pem
                path: key_sk
        - name: fabric-crypto-tls
          secret:
            secretName: fabric-crypto
            items:
              - key: ca.crt
                path: ca.crt

