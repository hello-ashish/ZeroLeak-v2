apiVersion: v1
kind: Secret
metadata:
  name: zeroleak-secrets
  namespace: zeroleak
  labels:
    app.kubernetes.io/name: zeroleak
    app.kubernetes.io/part-of: zeroleak-platform
type: Opaque
stringData:
  MONGO_USERNAME: "zeroleak"
  MONGO_PASSWORD: "zeroleak_secret_password"
  REDIS_PASSWORD: "zeroleak_redis_password"
  MONGODB_URI: "mongodb://zeroleak:zeroleak_secret_password@mongodb:27017/zeroleak?authSource=admin"
  REDIS_URL: "redis://:zeroleak_redis_password@redis:6379"
  ACCESS_TOKEN_SECRET: "replace_with_a_secure_jwt_secret_at_least_32_characters"
  QUESTION_ENCRYPTION_KEY: "qXA5UijFDNo2i7S5+mhxTVhYO0BCwbcfHAEKTvuDcPA="
  GROQ_API_KEY: ""
