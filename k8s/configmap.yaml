apiVersion: v1
kind: ConfigMap
metadata:
  name: zeroleak-config
  namespace: zeroleak
  labels:
    app.kubernetes.io/name: zeroleak
    app.kubernetes.io/part-of: zeroleak-platform
data:
  PORT: "4000"
  NODE_ENV: "production"
  CORS_ORIGIN: "*"
  ACCESS_TOKEN_EXPIRY: "1d"
  FABRIC_ENABLED: "false"
  FABRIC_CHANNEL_NAME: "zeroleak-channel"
  FABRIC_CHAINCODE_NAME: "zeroleak"
  FABRIC_MSP_ID: "Org1MSP"
  FABRIC_PEER_ENDPOINT: "fabric-peer:7051"
  FABRIC_PEER_HOST_ALIAS: "peer0.org1.example.com"
  AI_MODEL: "openai/gpt-oss-20b"
  DOTENV_CONFIG_QUIET: "true"
