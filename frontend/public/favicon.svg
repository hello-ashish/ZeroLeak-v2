<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1326"/>
      <stop offset="50%" stop-color="#080a17"/>
      <stop offset="100%" stop-color="#04050d"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="topFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="stroke1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="stroke2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="stroke3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="10"/>

  <!-- Isometric Layers Icon perfectly centered -->
  <g transform="translate(73.6, 73.6) scale(15.2)" filter="url(#glow)">
    <!-- Top Layer -->
    <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"
          fill="url(#topFill)" stroke="url(#stroke1)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Middle Layer -->
    <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"
          fill="none" stroke="url(#stroke2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom Layer -->
    <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"
          fill="none" stroke="url(#stroke3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>