paths:
  /api/admin/register:
    post:
      summary: Register a new admin
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adminId:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Admin registered successfully
        "400":
          description: Bad request

  /api/admin/login:
    post:
      summary: Login for admins
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
        "401":
          description: Unauthorized
