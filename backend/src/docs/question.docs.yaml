paths:
  /api/questions:
    get:
      summary: Get all questions (Admin)
      tags: [Question]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of questions
    post:
      summary: Create a new question (Professor)
      tags: [Question]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Question created
